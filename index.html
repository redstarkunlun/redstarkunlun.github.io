<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #0e1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f6fc;
      --text-sub: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.08);
      --text: #1f2328;
      --text-sub: #656d76;
      --accent: #0969da;
      --accent-glow: rgba(9, 105, 218, 0.08);
      --card-hover: rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .domain-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.03em;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover {
      border-color: var(--text-sub);
    }

    .profile-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .bio {
      color: var(--text-sub);
      font-size: 0.9rem;
      white-space: pre-line;
      line-height: 1.6;
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--card-hover);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .link-item:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .link-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .arrow {
      color: var(--text-sub);
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .link-item:hover .arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') !== 'light';
      if (isDark) {
        html.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-label').textContent = 'Light';
      } else {
        html.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-label').textContent = 'Dark';
      }
    }

    function copyDiscord() {
      const discordUser = "64ffe1ne";
      navigator.clipboard.writeText(discordUser).then(() => {
        const arrow = document.getElementById('discord-arrow');
        const orig = arrow.textContent;
        arrow.textContent = 'Copied!';
        arrow.style.color = '#58a6ff';
        setTimeout(() => {
          arrow.textContent = orig;
          arrow.style.color = '';
        }, 1800);
      });
    }
  </script>
