<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>64ffe1ne.cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.8);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f6fc;
      --text-sub: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.1);
      --text: #1f2328;
      --text-sub: #656d76;
      --accent: #0969da;
      --accent-glow: rgba(9, 105, 218, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover {
      border-color: var(--text-sub);
    }

    .profile-section {
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .bio {
      color: var(--text-sub);
      font-size: 1rem;
      font-weight: 400;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .link-item:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .link-item span {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header-bar">
        <div class="logo">64ffe1ne.cloud</div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
          <span id="theme-icon">🌙</span> <span id="theme-label">Dark</span>
        </button>
      </div>

      <div class="profile-section">
        <div class="status-badge">
          <span class="status-dot"></span> Under Construction
        </div>
        <h1>Welcome</h1>
        <p class="bio">
          Webサイトをリニューアル準備中です。公開までしばらくお待ちください。
        </p>
      </div>

      <div class="links-section">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="link-item">
          <span>GitHub</span>
          <span>&rarr;</span>
        </a>
        <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="link-item">
          <span>X (Twitter)</span>
          <span>&rarr;</span>
        </a>
        <a href="mailto:contact@64ffe1ne.cloud" class="link-item">
          <span>Contact</span>
          <span>&rarr;</span>
        </a>
      </div>
    </div>

    <footer>
      &copy; 2026 64ffe1ne.cloud. All rights reserved.
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') !== 'light';
      if (isDark) {
        html.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-label').textContent = 'Light';
      } else {
        html.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-label').textContent = 'Dark';
      }
    }
  </script>
</body>
</html>
