<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かふぇいん | 64ffe1ne.cloud</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f6fc;
      --text-sub: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.08);
      --text: #1f2328;
      --text-sub: #656d76;
      --accent: #0969da;
      --accent-glow: rgba(9, 105, 218, 0.08);
      --card-hover: rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .domain-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.03em;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover {
      border-color: var(--text-sub);
    }

    .profile-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .bio {
      color: var(--text-sub);
      font-size: 0.9rem;
      white-space: pre-line;
      line-height: 1.6;
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-hover);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .link-item:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .arrow {
      color: var(--text-sub);
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .link-item:hover .arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header-bar">
        <div class="domain-tag">64ffe1ne.cloud</div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
          <span id="theme-icon">🌙</span> <span id="theme-label">Dark</span>
        </button>
      </div>

      <div class="profile-section">
        <img src="https://prd.resource-api.lit.link/images/creators/539d0753-4c98-4a71-918e-58ec6db5a9e2/icons/c0f33324-04c3-41ab-91f9-4415aeff1dce.jpeg" alt="かふぇいん" class="avatar">
        <h1>かふぇいん</h1>
        <p class="bio">鹿児島ユナイテッドFCサポ ⚽
推し 🍓🫖 / 🕰🍰 / 🩹🦖</p>
      </div>

      <div class="links-section">
        <!-- X (Twitter) -->
        <a href="https://twitter.com/RedstarKunlun_" target="_blank" rel="noopener noreferrer" class="link-item">
          <span>X (Twitter)</span>
          <span class="arrow">&rarr;</span>
        </a>

        <!-- Last.fm -->
        <a href="https://www.last.fm/user/Leopard_kufc" target="_blank" rel="noopener noreferrer" class="link-item">
          <span>Last.fm</span>
          <span class="arrow">&rarr;</span>
        </a>

        <!-- 質問箱 (querie.me) -->
        <a href="https://querie.me/user/kufc111" target="_blank" rel="noopener noreferrer" class="link-item">
          <span>質問箱 (querie)</span>
          <span class="arrow">&rarr;</span>
        </a>

        <!-- Discord -->
        <div class="link-item" onclick="copyDiscord()">
          <span>Discord</span>
          <span class="arrow" id="discord-arrow">Copy</span>
        </div>
      </div>
    </div>

    <footer>
      &copy; 2026 かふぇいん / 64ffe1ne.cloud
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') !== 'light';
      if (isDark) {
        html.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-label').textContent = 'Light';
      } else {
        html.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-label').textContent = 'Dark';
      }
    }

    function copyDiscord() {
      const discordUser = "64ffe1ne";
      navigator.clipboard.writeText(discordUser).then(() => {
        const arrow = document.getElementById('discord-arrow');
        const orig = arrow.textContent;
        arrow.textContent = 'Copied!';
        arrow.style.color = '#58a6ff';
        setTimeout(() => {
          arrow.textContent = orig;
          arrow.style.color = '';
        }, 1800);
      });
    }
  </script>
</body>
</html>
